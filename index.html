<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HablaManu</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;margin:0}
h1{background:#00ff88;color:#000;text-align:center;padding:16px;margin:-12px -12px 12px;font-size:26px}
textarea{width:100%;height:150px;background:#111;color:#fff;font-size:22px;padding:12px;border-radius:12px;border:2px solid #333;box-sizing:border-box}
button{width:100%;padding:16px;font-size:20px;border-radius:12px;border:none;margin-top:10px;font-weight:bold}
.verde{background:#00ff88;color:#000}
.amarillo{background:#ffcc00;color:#000}
.morado{background:#b388ff;color:#000}
select{width:100%;padding:12px;font-size:18px;background:#111;color:#fff;border-radius:10px;margin-top:10px}
#estado{text-align:center;margin-top:10px;color:#ffcc00}
</style>
</head>
<body>
<h1>🎤 HablaManu<br><span style="font-size:16px">Tu app que habla, Manu</span></h1>
<textarea id="texto" placeholder="Escribe aquí, Manu...">Hola, Manu. Ya hablo, Manu. Y ahora también me descargo, Manu.</textarea>
<p id="contador">0 caracteres</p>
<button class="amarillo" onclick="cargarVoces()">🔄 Recargar Voces</button>
<select id="voces"></select>
<button class="verde" onclick="hablar()">🔊 HABLAR</button>
<button class="morado" onclick="descargarMP3()">⬇️ DESCARGAR MP3</button>
<p id="estado"></p>
<script>
let voces=[];
let texto=document.getElementById('texto');
let sel=document.getElementById('voces');
function contar(){document.getElementById('contador').innerText=texto.value.length+' caracteres';}
texto.addEventListener('input',contar); contar();
function cargarVoces(){
  voces=speechSynthesis.getVoices();
  sel.innerHTML='';
  let filtradas=voces.filter(v=>v.lang.toLowerCase().includes('es'));
  let lista=filtradas.length?filtradas:voces;
  lista.forEach((v,i)=>{
    let o=document.createElement('option');
    o.value=i; o.text=v.name+' - '+v.lang;
    sel.appendChild(o);
  });
  if(!lista.length){
    let o=document.createElement('option'); o.text='Usar voz por defecto de Google';
    sel.appendChild(o);
  }
}
function hablar(){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(texto.value);
  u.lang='es-MX'; u.rate=1;
  let filtradas=voces.filter(v=>v.lang.toLowerCase().includes('es'));
  if(filtradas.length) u.voice=filtradas[sel.selectedIndex]||filtradas[0];
  speechSynthesis.speak(u);
}
async function descargarMP3(){
  let t=texto.value.trim();
  if(!t){alert('Manu, escribe algo primero, Manu'); return;}
  document.getElementById('estado').innerText='Manu, preparando tu MP3, Manu... espera, Manu...';
  // Google TTS solo acepta pedazos de 200 letras, Manu. Lo partimos, Manu.
  let pedazos=[];
  while(t.length>0){ pedazos.push(t.slice(0,190)); t=t.slice(190); }
  try{
    let audios=[];
    for(let p of pedazos){
      let url='https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(p)+'&tl=es-MX&client=tw-ob';
      let r=await fetch(url);
      let b=await r.blob();
      audios.push(b);
    }
    let final=new Blob(audios,{type:'audio/mpeg'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(final);
    a.download='HablaManu.mp3';
    a.click();
    document.getElementById('estado').innerText='¡Listo, Manu! ¡Ya se descargó, Manu! Búscalo en Descargas, Manu.';
  }catch(e){
    document.getElementById('estado').innerText='Manu, no se pudo descargar, Manu. Intenta otra vez con internet, Manu.';
  }
}
speechSynthesis.onvoiceschanged=cargarVoces;
setTimeout(cargarVoces,500);
setTimeout(cargarVoces,1500);
</script>
</body>
</html>
