<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HablaManu - App Celular</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial; background:#0d0d0d; color:white; margin:0; padding:0; padding-bottom:90px}
  .header{background:#00ff88; color:#000; padding:18px 10px; text-align:center; position:sticky; top:0; z-index:10}
  .header h1{margin:0; font-size:24px}
  .cont{padding:12px}
  .card{background:#1e1e1e; border-radius:16px; padding:14px; margin-bottom:12px}
  textarea{width:100%; height:170px; border-radius:12px; padding:12px; font-size:18px; border:2px solid #333; background:#111; color:white; outline:none}
  select{width:100%; padding:14px; border-radius:12px; font-size:16px; background:#111; color:white; border:1px solid #333}
  .label{font-size:14px; color:#aaa; margin:10px 0 4px; display:block}
  input[type=range]{width:100%; height:35px; accent-color:#00ff88}
  .emociones{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .emociones button{padding:16px 5px; border:none; border-radius:14px; font-size:16px; font-weight:bold; cursor:pointer}
  .b-normal{background:#00ff88} .b-asombro{background:#ffcc00} .b-feliz{background:#ff66aa; color:white} .b-triste{background:#66aaff} .b-enojado{background:#ff4444; color:white} .b-susurro{background:#999} .b-robot{background:#00ccff} .b-narrar{background:#a066ff; color:white}
  .botonera{position:fixed; bottom:0; left:0; right:0; background:#1e1e1e; padding:10px; display:flex; gap:10px; border-top:1px solid #333}
  .botonera button{flex:1; padding:16px; border:none; border-radius:14px; font-size:19px; font-weight:bold}
  .hablar{background:#00ff88} .parar{background:#ff4444; color:white}
</style>
</head>
